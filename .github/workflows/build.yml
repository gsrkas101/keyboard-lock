name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test and build
        shell: powershell
        run: ./build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: KeyboardLock
          path: KeyboardLock.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: KeyboardLock
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" KeyboardLock.exe
          --repo "${{ github.repository }}"
          --title "Keyboard Lock ${{ github.ref_name }}"
          --generate-notes
